<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#94a3b8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico">
    <title>Monolith</title>
    <script>
      // vTual (valkivid3 str1 skin) — restore `html.dark` before first paint so
      // /vtual never flashes light. Default is dark (original template behavior).
      // Scoped utilities live under .vk3-root, so this is inert for /apps/* pages.
      try {
        if (localStorage.getItem('str1-color-theme') !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
