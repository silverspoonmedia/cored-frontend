name: CI

on:
  push:
    branches: [main, master, main-sandbox, main-staging]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build-only

  # `npm run check:i18n` guards this repo on its own: key parity across locales, the
  # duplicate-English and placeholder checks. It cannot see the backend, so it cannot
  # catch the defect class that spans both repos — English left inside translated
  # prose (`id` `Test` in 10 SPA keys was one), or a backend string that never reached
  # the SPA pack. The backend's `scripts/locale-prose-scan.php` reads both sides, so an
  # SPA-only pull request would otherwise merge without ever running it: the backend
  # workflow triggers on backend changes, not on this repo.
  #
  # The backend is private, so this job needs a token with read access to the sibling.
  # Set `BACKEND_REPO_TOKEN` in repository secrets; it falls back to `GITHUB_TOKEN` so
  # the job still runs (and fails on the checkout, not silently on the scan) when the
  # secret is absent.
  locale-cross-repo:
    name: Localization cross-repo scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SPA
        uses: actions/checkout@v4
        with:
          path: monolith-vue-workers

      - name: Checkout backend sibling (the scan lives there)
        uses: actions/checkout@v4
        with:
          repository: silverspoonmedia/monolith
          path: monolith
          token: ${{ secrets.BACKEND_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip, exif, curl
          coverage: none

      # The scan reads locale files with plain PHP (no framework boot), so no
      # `composer install` is needed.
      - name: Prose scan (English left in translated prose)
        working-directory: monolith
        run: php scripts/locale-prose-scan.php

      - name: Pack parity (backend packs vs SPA packs)
        working-directory: monolith
        run: php scripts/locale-pack-parity.php

      - name: Glossary scan (settled terms, banned variants)
        working-directory: monolith
        run: php scripts/locale-glossary-scan.php

      - name: Raw key scan (value is a dotted key)
        working-directory: monolith
        run: php scripts/locale-rawkey-scan.php
